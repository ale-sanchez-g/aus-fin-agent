name: CD

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-southeast-2

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: api
            context: apps/api
          - service: web
            context: apps/web
          - service: worker
            context: apps/worker
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push ${{ matrix.service }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/aus-fin-agent-${{ matrix.service }}:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/aus-fin-agent-${{ matrix.service }}:latest" \
            ${{ matrix.context }}
          docker push "$ECR_REGISTRY/aus-fin-agent-${{ matrix.service }}:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/aus-fin-agent-${{ matrix.service }}:latest"

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update ECS services
        run: |
          for SERVICE in api web worker; do
            aws ecs update-service \
              --cluster aus-fin-agent-dev \
              --service aus-fin-agent-dev-$SERVICE \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }} || true
          done
